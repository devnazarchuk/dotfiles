# ThinkBook 13s-IML (20RR): fix built-in DMIC microphone silence
#
# The two built-in digital microphones are wired to PDM1 port on the Intel
# Comet Lake SOF DSP. The default topology (sof-hda-generic-2ch.tplg) targets
# PDM0, which causes an init burst followed by permanent silence.
# Forcing pdm1 topology routes audio through the correct PDM1 port.
#
# Symptoms without this fix:
#   - Brief MAX-level noise burst at recording start
#   - Complete silence afterwards
#   - journalctl shows: "Topology: ABI 3:22:1 Kernel ABI 3:23:1"
options snd_sof_pci tplg_filename=sof-hda-generic-2ch-pdm1.tplg
