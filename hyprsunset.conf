# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# 18:00 - Активуємо теплий колір (фільтр синього світла) до 00:00
profile {
    time = 18:00
    temperature = 3500
}

# 00:00 - Повертаємо дещо прохолодніше, але все ще приємно для очей до ранку
profile {
    time = 00:00
    temperature = 5000
}
# To enable auto switch to nightlight, set in your .config/hypr/autostart:
# exec-once = uwsm app -- hyprsunset
# and use the following:
# profile {
#     time = 20:00
#     temperature = 4000
# }
