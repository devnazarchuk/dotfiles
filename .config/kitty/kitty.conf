# ==============================================================================
# FONTS
# ==============================================================================
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures no

# ==============================================================================
# WINDOW & PADDING
# ==============================================================================
remember_window_size      no
window_padding_width      5
background_opacity        0.40
dynamic_background_opacity yes
confirm_os_window_close   0

# ==============================================================================
# CURSOR & MOUSE
# ==============================================================================
cursor_shape          block
cursor_blink_interval 0
cursor_trail          3
url_style             curly

# ==============================================================================
# SCROLLBAR
# ==============================================================================
scrollbar_handle_opacity      0
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0

# ==============================================================================
# PERFORMANCE & SYSTEM
# ==============================================================================
shell                 zsh
shell_integration     disabled
enable_audio_bell     no
sync_to_monitor       no
repaint_delay         8
input_delay           3

# ==============================================================================
# KEY BINDINGS & SHORTCUTS
# ==============================================================================
# Clipboard Operations
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+x copy_to_clipboard

# Send Interrupt Signal (Ctrl+C equivalent via Ctrl+Shift+Q)
map ctrl+shift+q send_text all \x03

# Word Navigation (Ctrl + Left / Right Arrow)
map ctrl+left  send_text all \x1b[1;5D
map ctrl+right send_text all \x1b[1;5C

# Word Deletion (Ctrl + Backspace / Delete)
map ctrl+backspace send_text all \x08
map ctrl+delete    send_text all \x1b[3;5~

# ==============================================================================
# THEME INCLUSION
# ==============================================================================
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include colors.conf
# END_KITTY_THEME